get:
  tags: [Patients]
  operationId: listPatients
  summary: Search patients by name or identifier
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters.yaml#/Limit"
    - $ref: "../../components/parameters.yaml#/Offset"
    - name: query
      in: query
      required: false
      schema:
        type: string
      description: Search by name or identifier (NIK / IHS).
  responses:
    "200":
      description: A list of patients
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Patient.yaml"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
post:
  tags: [Patients]
  operationId: createPatient
  summary: Register a new patient
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/NewPatient.yaml"
  responses:
    "201":
      description: Patient created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Patient.yaml"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "409":
      description: Duplicate NIK / identifier
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Error.yaml"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
