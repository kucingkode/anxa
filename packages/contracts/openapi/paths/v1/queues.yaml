get:
  tags: [Queues]
  operationId: listQueues
  summary: List / search queue entries
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters.yaml#/Limit"
    - $ref: "../../components/parameters.yaml#/Offset"
    - name: patientId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [waiting, in-service, done, cancelled]
  responses:
    "200":
      description: A list of queue entries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Queue.yaml"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
post:
  tags: [Queues]
  operationId: createQueue
  summary: Add a patient to the service queue (status `waiting`)
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/NewQueue.yaml"
  responses:
    "201":
      description: Queue entry created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Queue.yaml"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "409":
      description: Patient is already queued for an active visit
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Error.yaml"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
