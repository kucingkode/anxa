get:
  tags: [Observations]
  operationId: getObservation
  summary: Get an observation by id
  security:
    - bearerAuth: []
  parameters:
    - name: observationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Observation found
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Observation.yaml"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
patch:
  tags: [Observations]
  operationId: updateObservation
  summary: Update observation value / interpretation (optimistic locking)
  security:
    - bearerAuth: []
  parameters:
    - name: observationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: "../../../components/parameters.yaml#/IfMatch"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/UpdateObservation.yaml"
  responses:
    "200":
      description: Observation updated
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Observation.yaml"
    "400":
      $ref: "../../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "412":
      $ref: "../../../components/responses.yaml#/PreconditionFailed"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
delete:
  tags: [Observations]
  operationId: deleteObservation
  summary: Soft-delete an observation (status `entered-in-error`)
  security:
    - bearerAuth: []
  parameters:
    - name: observationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Observation deleted
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "409":
      description: Observation is already in a terminal state
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Error.yaml"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
