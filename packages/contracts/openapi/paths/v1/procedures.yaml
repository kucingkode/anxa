get:
  tags: [Procedures]
  operationId: listProcedures
  summary: List / search patient procedures
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters.yaml#/Limit"
    - $ref: "../../components/parameters.yaml#/Offset"
    - name: patientId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: visitId
      in: query
      required: false
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: A list of procedures
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Procedure.yaml"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
post:
  tags: [Procedures]
  operationId: createProcedure
  summary: Add a performed patient procedure
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/NewProcedure.yaml"
  responses:
    "201":
      description: Procedure created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Procedure.yaml"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
