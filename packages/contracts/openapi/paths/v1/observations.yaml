get:
  tags: [Observations]
  operationId: listObservations
  summary: List / search clinical observations
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters.yaml#/Limit"
    - $ref: "../../components/parameters.yaml#/Offset"
    - name: patientId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: visitId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [preliminary, final, amended, cancelled, entered-in-error]
  responses:
    "200":
      description: A list of observations
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Observation.yaml"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
post:
  tags: [Observations]
  operationId: createObservation
  summary: Add patient observation data
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/NewObservation.yaml"
  responses:
    "201":
      description: Observation created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Observation.yaml"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
