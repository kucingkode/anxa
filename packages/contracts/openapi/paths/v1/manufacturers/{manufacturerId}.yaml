get:
  tags: [Manufacturers]
  operationId: getManufacturer
  summary: Get a manufacturer by id
  security:
    - bearerAuth: []
  parameters:
    - name: manufacturerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Manufacturer found
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Manufacturer.yaml"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
patch:
  tags: [Manufacturers]
  operationId: updateManufacturer
  summary: Update a manufacturer
  security:
    - bearerAuth: []
  parameters:
    - name: manufacturerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/UpdateManufacturer.yaml"
  responses:
    "200":
      description: Manufacturer updated
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Manufacturer.yaml"
    "400":
      $ref: "../../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
delete:
  tags: [Manufacturers]
  operationId: deleteManufacturer
  summary: Soft-delete a manufacturer
  security:
    - bearerAuth: []
  parameters:
    - name: manufacturerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Manufacturer deleted
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "409":
      description: Manufacturer is still referenced by a product
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Error.yaml"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
