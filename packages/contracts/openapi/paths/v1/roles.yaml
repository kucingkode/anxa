get:
  tags: [Roles]
  operationId: listRoles
  summary: List / search roles
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters.yaml#/Limit"
    - $ref: "../../components/parameters.yaml#/Offset"
    - name: query
      in: query
      required: false
      schema:
        type: string
      description: Search by role name.
  responses:
    "200":
      description: A list of roles
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Role.yaml"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
post:
  tags: [Roles]
  operationId: createRole
  summary: Add a custom role
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/NewRole.yaml"
  responses:
    "201":
      description: Role created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Role.yaml"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "409":
      description: Role name already in use
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Error.yaml"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
