get:
  tags: [Procedures]
  operationId: getProcedure
  summary: Get a procedure by id
  security:
    - bearerAuth: []
  parameters:
    - name: procedureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Procedure found
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Procedure.yaml"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
patch:
  tags: [Procedures]
  operationId: updateProcedure
  summary: Update a patient procedure
  security:
    - bearerAuth: []
  parameters:
    - name: procedureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/UpdateProcedure.yaml"
  responses:
    "200":
      description: Procedure updated
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Procedure.yaml"
    "400":
      $ref: "../../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
delete:
  tags: [Procedures]
  operationId: deleteProcedure
  summary: Soft-delete a patient procedure
  security:
    - bearerAuth: []
  parameters:
    - name: procedureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Procedure deleted
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
