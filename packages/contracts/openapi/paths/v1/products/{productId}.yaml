get:
  tags: [Products]
  operationId: getProduct
  summary: Get a product by id
  security:
    - bearerAuth: []
  parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Product found
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Product.yaml"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
patch:
  tags: [Products]
  operationId: updateProduct
  summary: Update a product
  security:
    - bearerAuth: []
  parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/UpdateProduct.yaml"
  responses:
    "200":
      description: Product updated
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Product.yaml"
    "400":
      $ref: "../../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
delete:
  tags: [Products]
  operationId: deleteProduct
  summary: Soft-delete a product
  security:
    - bearerAuth: []
  parameters:
    - name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Product deleted
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "409":
      description: Product is still referenced by the catalog
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Error.yaml"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
