get:
  tags: [Condition References]
  operationId: getConditionReference
  summary: Get a condition reference by id
  security:
    - bearerAuth: []
  parameters:
    - name: conditionReferenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Condition reference found
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/ConditionReference.yaml"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
patch:
  tags: [Condition References]
  operationId: updateConditionReference
  summary: Update a condition reference
  security:
    - bearerAuth: []
  parameters:
    - name: conditionReferenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/UpdateConditionReference.yaml"
  responses:
    "200":
      description: Condition reference updated
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/ConditionReference.yaml"
    "400":
      $ref: "../../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
delete:
  tags: [Condition References]
  operationId: deleteConditionReference
  summary: Delete a condition reference (blocked while referenced by a Condition)
  security:
    - bearerAuth: []
  parameters:
    - name: conditionReferenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Condition reference deleted
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "409":
      description: Reference is still in use by a clinical Condition
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Error.yaml"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
