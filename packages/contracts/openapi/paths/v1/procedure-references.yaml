get:
  tags: [Procedure References]
  operationId: listProcedureReferences
  summary: List / search the procedure reference list
  security:
    - bearerAuth: []
  parameters:
    - $ref: "../../components/parameters.yaml#/Limit"
    - $ref: "../../components/parameters.yaml#/Offset"
    - name: query
      in: query
      required: false
      schema:
        type: string
      description: Search by code or display name.
  responses:
    "200":
      description: A list of procedure references
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/ProcedureReference.yaml"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
post:
  tags: [Procedure References]
  operationId: createProcedureReference
  summary: Add a procedure reference
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/NewProcedureReference.yaml"
  responses:
    "201":
      description: Procedure reference created
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/ProcedureReference.yaml"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "409":
      description: Duplicate code
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Error.yaml"
    "500":
      $ref: "../../components/responses.yaml#/InternalServerError"
