get:
  tags: [Conditions]
  operationId: getCondition
  summary: Get a condition by id
  security:
    - bearerAuth: []
  parameters:
    - name: conditionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: Condition found
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Condition.yaml"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
patch:
  tags: [Conditions]
  operationId: updateCondition
  summary: Update a patient condition
  security:
    - bearerAuth: []
  parameters:
    - name: conditionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/UpdateCondition.yaml"
  responses:
    "200":
      description: Condition updated
      content:
        application/json:
          schema:
            $ref: "../../../components/schemas/Condition.yaml"
    "400":
      $ref: "../../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
delete:
  tags: [Conditions]
  operationId: deleteCondition
  summary: Soft-delete a patient condition
  security:
    - bearerAuth: []
  parameters:
    - name: conditionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "204":
      description: Condition deleted
    "401":
      $ref: "../../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../../components/responses.yaml#/Forbidden"
    "404":
      $ref: "../../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../../components/responses.yaml#/InternalServerError"
