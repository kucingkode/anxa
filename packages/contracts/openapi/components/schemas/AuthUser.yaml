type: object
required: [id, email, role, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    maxLength: 255
  email:
    type: string
    format: email
    maxLength: 255
  role:
    $ref: "./Role.yaml"
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
