type: object
required: [id, email, roleId, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    maxLength: 255
  email:
    type: string
    format: email
    maxLength: 255
  roleId:
    type: string
    format: uuid
    description: Reference to the user's Role.
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
