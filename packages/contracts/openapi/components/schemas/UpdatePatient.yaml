type: object
description: |
  Editable patient demographics. The `identifier` (NIK) is immutable after
  creation and must not be sent here.
properties:
  name:
    type: string
    minLength: 1
  gender:
    type: string
    enum: [male, female, other, unknown]
  birthDate:
    type: string
    format: date
  phone:
    type: string
