type: object
description: |
  Performed-procedure record attached to a patient visit. Mapped to FHIR R4
  `Procedure`.
required: [id, patientId, visitId, code, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
  patientId:
    type: string
    format: uuid
  visitId:
    type: string
    format: uuid
  code:
    type: string
    description: Procedure code chosen from the procedure reference list.
  codeDisplay:
    type: string
  status:
    type: string
    description: FHIR R4 `Procedure.status` (e.g. preparation, completed).
  performedAt:
    type: string
    format: date-time
  notes:
    type: string
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
