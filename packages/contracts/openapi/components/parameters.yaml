Limit:
  name: limit
  in: query
  required: false
  description: Maximum number of records to return.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

Offset:
  name: offset
  in: query
  required: false
  description: Number of records to skip before returning results.
  schema:
    type: integer
    minimum: 0
    default: 0

IfMatch:
  name: If-Match
  in: header
  required: true
  description: |
    Current resource `version` for optimistic locking. The update is rejected
    with `412` when it does not match the stored version.
  schema:
    type: string
